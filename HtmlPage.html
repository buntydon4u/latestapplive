        function CheckAkhar()
        {
          
            var bval = document.getElementById("TextBox1").value;
            bval = bval.toUpperCase();
            while (bval.includes("("))
                bval = bval.replace("(", "*");
            while (bval.includes("INTO"))
                bval = bval.replace("INTO", "*");
            while (bval.includes("IN"))
                bval = bval.replace("IN", "*");
            while (bval.includes("="))
            bval = bval.replace("=", "*");

            while (bval.includes("!"))
                bval = bval.replace("!", ",");
            while (bval.includes("@"))
                bval = bval.replace("@", ",");
            while (bval.includes("#"))
                bval = bval.replace("#", ",");
            while (bval.includes("$"))
                bval = bval.replace("$", ",");
            while (bval.includes("%"))
                bval = bval.replace("%", ",");
            while (bval.includes("^"))
                bval = bval.replace("^", ",");
            while (bval.includes("&"))
                bval = bval.replace("&", ",");
            while (bval.includes("-"))
                bval = bval.replace("-", ",");
            while (bval.includes(" "))
                bval = bval.replace(" ", ",");
            while (bval.includes("/"))
                bval = bval.replace("/", ",");
            while (bval.includes("|"))
                bval = bval.replace("|", ",");
            while (bval.includes("a"))
                bval = bval.replace("a", "A");
            while (bval.includes("b"))
            bval = bval.replace("b", "B");
           
            document.getElementById("TextBox1").value= bval;
            

          
            
        }



        function IsNonDigit(str,i,akharchar)
        {
            var ascode = str.charCodeAt(i);
            
            if (ascode < 48 || ascode > 57 || isNaN(ascode)) {
                return true;
                //alert(ascode);
            }
            else {
                var charcount = 0;

                for (j = 0; j < str.length; j++) {
                    var asco = str.charCodeAt(j);
                    var asco1 = akharchar.charCodeAt(0);
                    if (asco >= 48 && asco <= 57) {
                        if (asco != ascode)
                            return true;
                    }
                    else if (asco1 == asco)
                        charcount++;
                    else
                        return true;

                }
                if (charcount > 1) return true;
            }

            return false;

        }

        function Mycode() {

            var bval = document.getElementById("TextBox1").value;//document.getElementById('<%=TextBox1.ClientID%>').value;
            var msg;
            var finalnumlist = "";
            const numberList1 = (bval
                    .split("*"));

            if (numberList1.length == 1) {
                msg = "Amount Not Found against those number :- " + bval;
                alert(msg);
                return false;
            }
            if (numberList1.length > 2) {
                msg = "Multiple Amount ( ";
                for (var i = 1; i < numberList1.length; i = i + 1)
                    msg = msg + numberList1[i] + ", ";

                msg = msg + " ) against those number :-" + numberList1[0];
                alert(msg);
                return false;
            }



            var numlist = numberList1[0];
            var nums = numlist.split(",");
            var amtlist = "";

            var correctamount = "";
            for (var j = 0; j < numberList1[1].length; j++)   // remove non digit from amount
            {
                var ascode = numberList1[1].charCodeAt(j);
               
               
                if (ascode >= 48 && ascode <= 57) {
                    correctamount = correctamount + numberList1[1][j]; 
                }

            }
            numberList1[1] = correctamount;
         


            // making list of number and amouunt in order with coma seprate


            for (var i = 0 ; i < nums.length; i = i + 1) {

                var str = nums[i];
                if (str.trim() != "")
                {
                    if (str.length > 2 || str.includes("A") || str.includes("B"))
                    {
                        var ind;
                        var newstr;
                        if (str.includes("A")) {
                            ind = str.indexOf("A");
                            if (ind == 0) {

                                if (IsNonDigit(str,1,"A")) { alert(str + " is Not A valid Number"); return false; }
                                newstr = str[1] + str[1] + str[1];                              
                                nums[i] = newstr;

                            }
                            else {
                                if (IsNonDigit(str,0,"A")) { alert(str + " is Not A valid Number"); return false; }
                                newstr = str[0] + str[0] + str[0];
                                nums[i] = newstr;
                            }
                        }
                        if (str.includes("B")) {
                            ind = str.indexOf("B");
                            if (ind == 0) {
                                if (IsNonDigit(str,1,"B")) { alert(str + " is Not A valid Number"); return false; }
                                newstr = str[1] + str[1] + str[1] + str[1];
                                nums[i] = newstr;
                            }
                            else {
                                if (IsNonDigit(str,0,"B")) { alert(str + " is Not A valid Number"); return false; }
                                newstr = str[0] + str[0] + str[0] + str[0];
                                nums[i] = newstr;
                            }
                        }

                        
                    } // end if str.length > 2 || str.includes("A") || str.includes("B")
                    else
                    {
                        // Check in number is any char or other Value
                        for(var j=0;j<str.length;j=j+1)
                        {
                            var ascode = str.charCodeAt(j);
                            if(ascode<48 || ascode>57)
                            { alert( str + " is Not A valid Number"); return false; }
                        }
                    }

                    //----------------------------- adding number and amount in diffretn list 
                    if (i == nums.length - 1) {
                        amtlist = amtlist + numberList1[1];
                        finalnumlist = finalnumlist + nums[i];
                    }
                    else {
                        amtlist = amtlist + numberList1[1] + ",";
                        finalnumlist = finalnumlist + nums[i] + ",";
                    }


                


                }// end of if str.trim() != ""

            } // End of Loop var i = 0 ; i < nums.length; i = i + 1





          //  document.getElementById("TextBox1").value="";

          





            var newRow = document.getElementById('addtrn').insertRow();
            newRow.innerHTML =
                '<tr><th><input type="text" class="form-control" name="trn_number[]" value="' +
               finalnumlist +
                '" placeholder="Number" onkeypress="return (event.charCode !=8 && event.charCode ==0 || (event.charCode >= 48 && event.charCode <= 57))" onkeyup="checkshift(this)"></th> <th><input type="text" class="form-control" value="' +
             amtlist +
                '" name="trn_amount[]" onkeypress="return (event.charCode !=8 && event.charCode ==0 || (event.charCode >= 48 && event.charCode <= 57))" placeholder="Amount" ></th><td><span class="delete" onClick="$(this).parent().parent().remove();"> X </span></td></tr>';


            return true;
        }


        //--------------------------------------------------from to Amount

        function IscorrectDigit(str)
        {
            for (var j = 0; j < str.length; j = j + 1) {
                var ascode = str.charCodeAt(j);
                if (ascode < 48 || ascode > 57)
                { return true; }
            }
            return false;
        }
        function MyAkhar() {
           
            var fr = document.getElementById("frmtxt").value;
           var to = document.getElementById("totxt").value;
           var amt = document.getElementById("amttxt").value;
            
            if (IscorrectDigit(fr)) { alert(fr+"From number is not Valid"); return; }
            if (IscorrectDigit(to)) { alert(to+"To number is not Valid"); return; }

            fr = parseInt(fr);
            to = parseInt(to);
            if(fr>to)
            { alert("From Number is Greater Then To Number"); return;}

            var amountlist=""
            for (var j = fr; j <= to;j=j+1)
            {
                fromtonumberlist = fromtonumberlist + j + ",";
                amountlist = amountlist + amt + ",";
               
            }



            var newRow = document.getElementById('addtrn').insertRow();
            newRow.innerHTML =

               fromtonumberlist +

                '" name="trn_amount[]" onkeypress="return (event.charCode !=8 && event.charCode ==0 || (event.charCode >= 48 && event.charCode <= 57))" placeholder="Amount" ></th><td><span class="delete" onClick="$(this).parent().parent().remove();"> X </span></td></tr>';

        }

        function Mycros()
        {
            var crnum1 = document.getElementById("crnum1").value;
