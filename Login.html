   <script>
        const togglePassword = document.querySelector("#togglePassword");
        const password = document.querySelector("#password");

        togglePassword.addEventListener("click", function () {
            // toggle the type attribute
            const type = password.getAttribute("type") === "password" ? "text" : "password";
            password.setAttribute("type", type);
            
            // toggle the icon
            this.classList.toggle("bi-eye");
        });

    </script>
  <script>
  function changeform(elem){
  var val = elem.value;
  if(val == '1'){
  document.getElementById('loginwithusername').style.display = 'block';
  document.getElementById('loginwithmobile').style.display = 'none';
  }
  else{
  //loginwithmobile
  document.getElementById('loginwithusername').style.display = 'none';
  document.getElementById('loginwithmobile').style.display = 'block';
  }
  }
